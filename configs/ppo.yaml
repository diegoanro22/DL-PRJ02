# PPO Atari, base RL-Zoo. n_envs=16 en vez de 8: medido 1977 vs 4321 FPS aqui.
algo: ppo
n_envs: 16
total_timesteps: 100_000_000
eval_cada: 2_000_000
save_cada: 5_000_000
politica: CnnPolicy
hiperparametros:
  n_steps: 128
  batch_size: 256
  n_epochs: 4
  learning_rate: lin_2.5e-4
  clip_range: lin_0.1
  ent_coef: 0.01
  vf_coef: 0.5
  gamma: 0.99
  gae_lambda: 0.95
